name: ci-go-admin-ui

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-admin-ui
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: amazingye-oss
  GITOPS_REPO: AmazingYe-oss/infra-gitops

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint || true

  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.shortsha.outputs.short }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_ACCESS_KEY_ID }}
          password: ${{ secrets.ACR_ACCESS_KEY_SECRET }}

      - name: Compute short SHA
        id: shortsha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GHCR + ACR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.shortsha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/go-admin-ui:sha-${{ steps.shortsha.outputs.short }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/go-admin-ui:latest
          labels: |
            org.opencontainers.image.title=go-admin-ui
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ⭐ 关键步骤：CI 完成后自动改 infra-gitops 仓库的 image.tag，触发 ArgoCD 同步
  gitops-bump:
    name: Bump image tag in infra-gitops
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout infra-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image.tag in all env files
        run: |
          set -euo pipefail
          SHORT="${{ needs.build.outputs.short-sha }}"
          NEW_TAG="sha-${SHORT}"
          cd gitops
          for f in go-admin-ui-chart/values.yaml go-admin-ui-chart/values-ui-dev.yaml go-admin-ui-chart/values-ui-staging.yaml go-admin-ui-chart/values-ui-prod.yaml; do
            if [ -f "$f" ]; then
              sed -i "s|^  tag:.*$|  tag: \"${NEW_TAG}\"|" "$f"
              echo "Updated $f -> tag: ${NEW_TAG}"
            fi
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: bump go-admin-ui image to ${{ needs.build.outputs.short-sha }}"
            git push origin main
          fi