# GitLab CI/CD 流水线 - go-admin-ui 前端
# 流水线阶段: lint -> install -> build -> scan -> push

stages:
  - lint
  - install
  - build
  - scan
  - push

variables:
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}"

# ===== 阶段 1: lint - ESLint 代码检查 =====
lint:
  stage: lint
  script:
    - echo "=== ESLint 代码检查 ==="
    - which npm || (echo "Node.js not found" && exit 1)
    - npm install --registry=https://registry.npmmirror.com --legacy-peer-deps
    - npm run lint 2>&1 || true
    - echo "Lint 检查完成"
  allow_failure: true

# ===== 阶段 2: install - 依赖安装（缓存层）=====
install:
  stage: install
  script:
    - echo "=== 安装 npm 依赖 ==="
    - npm install --registry=https://registry.npmmirror.com --legacy-peer-deps
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    - main

# ===== 阶段 3: build - 多阶段构建镜像 =====
build:
  stage: build
  script:
    - echo "=== 构建多阶段 Docker 镜像 ==="
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker tag ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} ${IMAGE_NAME}:latest
    - echo "=== 镜像大小 ==="
    - docker images ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} --format "{{.Size}}"
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -o go-admin-ui-image.tar
  artifacts:
    paths:
      - go-admin-ui-image.tar
    expire_in: 1 hour

# ===== 阶段 4: scan - Trivy 漏洞扫描 =====
scan:
  stage: scan
  script:
    - echo "=== Trivy 漏洞扫描 ==="
    - which trivy || (curl -sfL https://mirrors.aliyun.com/trivy/trivy_0.55.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz && tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy)
    - docker load -i go-admin-ui-image.tar
    - trivy image --exit-code 1 --severity CRITICAL ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
    - trivy image --format json -o trivy-report.json ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} || true
    - echo "=== 扫描完成 ==="
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 7 days
  allow_failure: true

# ===== 阶段 5: push - 推送到 GitLab Container Registry =====
push:
  stage: push
  script:
    - echo "=== 推送镜像到 GitLab Container Registry ==="
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker load -i go-admin-ui-image.tar
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest
    - echo "=== 镜像推送完成 ==="
    - echo "镜像地址: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
  only:
    - main
